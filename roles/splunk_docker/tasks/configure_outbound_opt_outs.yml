---
- name: Ensure Splunk instrumentation app-local directory exists
  ansible.builtin.file:
    path: "{{ splunk_docker_etc_dir }}/apps/splunk_instrumentation/local"
    state: directory
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0755'
  when: not (splunk_docker_allow_internet_access | bool)

- name: Disable Splunk usage telemetry
  ansible.builtin.template:
    src: telemetry.conf.j2
    dest: "{{ splunk_docker_etc_dir }}/apps/splunk_instrumentation/local/telemetry.conf"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0644'
  when: not (splunk_docker_allow_internet_access | bool)
  notify: Restart Splunk container

- name: Remove Splunk telemetry opt-out when internet access is enabled
  ansible.builtin.file:
    path: "{{ splunk_docker_etc_dir }}/apps/splunk_instrumentation/local/telemetry.conf"
    state: absent
  when: splunk_docker_allow_internet_access | bool
  notify: Restart Splunk container

- name: Ensure offline-disabled app-local directories exist
  ansible.builtin.file:
    path: "{{ splunk_docker_etc_dir }}/apps/{{ item }}/local"
    state: directory
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0755'
  loop:
    - splunk_secure_gateway
    - Splunk_AI_Assistant_Cloud
  when: not (splunk_docker_allow_internet_access | bool)

- name: Disable apps that can initiate internet requests
  ansible.builtin.template:
    src: disabled_app.conf.j2
    dest: "{{ splunk_docker_etc_dir }}/apps/{{ item }}/local/app.conf"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0644'
  loop:
    - splunk_secure_gateway
    - Splunk_AI_Assistant_Cloud
  when: not (splunk_docker_allow_internet_access | bool)
  notify: Restart Splunk container

- name: Remove offline app-disable overlays when internet access is enabled
  ansible.builtin.file:
    path: "{{ splunk_docker_etc_dir }}/apps/{{ item }}/local/app.conf"
    state: absent
  loop:
    - splunk_secure_gateway
    - Splunk_AI_Assistant_Cloud
  when: splunk_docker_allow_internet_access | bool
  notify: Restart Splunk container

- name: Verify TLS for Splunk's Python runtime
  ansible.builtin.lineinfile:
    path: "{{ splunk_docker_etc_dir }}/splunk-launch.conf"
    regexp: '^PYTHONHTTPSVERIFY='
    line: PYTHONHTTPSVERIFY=1
    create: true
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0644'
  notify: Restart Splunk container
