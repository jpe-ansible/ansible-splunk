---
# Splunkbase/GitHub release sync — mirrors latest stable packages, optional release history, and manifest
#
# Splunkbase entries resolve the latest release from the public API and keep the
# version-free object key consumed by the air-gapped Splunk VM. When enabled,
# every downloadable Splunkbase release and matching GitHub release asset is
# also stored at app_dir/version/filename. `manifest.json` retains the app_dir
# -> {version, filename} mapping and lists sorted versioned releases per app.
#
# `pin_version` on an entry overrides resolution (hold back a bad release).
#
# Idempotent: skips download when the bucket `version` tag already matches the
# resolved latest. Fail-soft: if Splunkbase is unreachable, the whole resolve/sync
# block is rescued — the existing bucket contents + manifest are left intact so a
# deploy can still proceed. This playbook also runs as an in-flow pre-play of
# site.yml; it stays usable standalone for manual/scheduled syncs.
#
# Credentials (environment):
#   SPLUNKBASE_USERNAME      / SPLUNKBASE_PASSWORD          — Splunkbase account (download only)
#   OBJECT_STORAGE_ROOT_USER / OBJECT_STORAGE_ROOT_PASSWORD — object-storage bucket write auth
#
# Usage:
#   ansible-playbook playbooks/sync-splunkbase.yml
#
# Runs entirely on localhost (the Ansible controller, which has internet egress).
# The Splunk VM never contacts Splunkbase — air-gap preserved.

- name: Load OpenTofu inventory (for object-storage endpoint)
  ansible.builtin.import_playbook: ../inventory/load_tofu.yml

- name: Mirror latest Splunkbase add-ons into object storage
  hosts: localhost
  connection: local
  gather_facts: false
  # Tagged so a converge from outside the object store's network segment can
  # leave the mirror out (`--skip-tags splunkbase`) and deploy from whatever the
  # bucket already holds — the same outcome the rescue below produces when
  # Splunkbase itself is unreachable.
  tags: [splunkbase]
  vars:
    splunkbase_api: "{{ splunkbase_api_url | default('https://splunkbase.splunk.com') }}"
    splunkbase_sync_tmpdir: /tmp/splunkbase-sync
    # The backfill uploads every historical release, so enable it only after the object store has room for it.
    splunkbase_sync_release_history: false
    object_storage_bucket: splunk-addons
    # aws reads credentials and the endpoint from the environment — nothing is
    # ever written to ~/.aws. The region is unused by the object store but the
    # SigV4 signer refuses to run without one.
    s3_env:
      AWS_ACCESS_KEY_ID: "{{ lookup('env', 'OBJECT_STORAGE_ROOT_USER') }}"
      AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'OBJECT_STORAGE_ROOT_PASSWORD') }}"
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: >-
        http://{{ hostvars['localhost']['tofu_data']['containers']['s3']['ip'] }}:{{
        hostvars['localhost']['tofu_data']['constants']['service_ports']['object_storage_s3'] }}

  tasks:
    - name: Check environment and object-storage client prerequisites
      ansible.builtin.include_tasks: tasks/sync-splunkbase/preflight.yml

    - name: Load and validate the add-on registry
      ansible.builtin.include_tasks: tasks/sync-splunkbase/prepare-run.yml

    - name: Resolve latest, sync drifted apps, and publish manifest
      block:
        - name: Resolve, download, and mirror drifted Splunkbase entries
          ansible.builtin.include_tasks: tasks/sync-splunkbase/resolve-and-sync.yml
      rescue:
        - name: Stop a fail-closed Splunkbase update
          ansible.builtin.fail:
            msg: >-
              Splunkbase resolve/sync failed; bucket + manifest.json were left
              unchanged. {{ ansible_failed_result.msg | default('See preceding task.') }}
          when: not (splunkbase_sync_fail_open | default(true) | bool)

        - name: Continue a fail-open interactive deployment from existing object-storage contents
          ansible.builtin.debug:
            msg: >-
              Splunkbase resolve/sync failed; leaving the bucket + manifest.json as-is and
              proceeding with whatever is already mirrored. Error:
              {{ ansible_failed_result.msg | default('see preceding task') }}
          when: splunkbase_sync_fail_open | default(true) | bool

    - name: Verify published object-storage tags and manifest
      ansible.builtin.include_tasks: tasks/sync-splunkbase/verify-manifest.yml
      when: splunkbase_manifest_work_required | default(splunkbase_plan is not defined or splunkbase_plan | length > 0) | bool
